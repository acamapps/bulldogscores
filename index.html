<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulldogs Scoring & Timing</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
}

.container {
  width: 90vw;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

.row {
  height: 8vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* COLOURS */
.header { background: #1e1e1e; color: white; }
.bulldogs { background: #0b3d91; color: white; }
.opposition { background: white; color: black; }
.time-section { background: red; color: white; }

/* TEXT */
.title { font-size: 5vh; font-family: 'Orbitron'; }
.subtitle { font-size: 3.5vh; font-family: 'Orbitron'; }

/* SCORES */
.score-values {
  display: flex;
  width: 100%;
  justify-content: space-around;
}

.score-box {
  width: 40%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.label { font-size: 1.6vh; }
.value { font-size: 5.5vh; }

/* BUTTONS */
.button-row {
  display: flex;
  width: 100%;
  justify-content: space-around;
}

.button-group {
  width: 40%;
  display: flex;
}

button {
  flex: 1;
  border: none;
  border-radius: 0.8vh;
}

/* SVG ICONS */
button svg {
  width: 60%;
  height: 60%;
  fill: currentColor;
  display: block;
  margin: auto;
}

/* TIME BUTTONS */
.time-buttons {
  width: 100%;
  display: flex;
  height: 100%;
}

.time-buttons button {
  height: 70%;
}

/* COLOURS */
.plus { background: #C2FFA3; }
.minus { background: #FF9999; }
.play { background: #C2FFA3; }
.pause { background: #FFE599; }
.reset { background: #FF9999; }

/* DISABLED */
button:disabled {
  background: #cccccc !important;
  color: #666;
  cursor: not-allowed;
}

/* PRESS */
button:active:not(:disabled) {
  transform: scale(0.95);
}

/* TOTAL */
.total-box {
  display: flex;
  align-items: center;
  justify-content: center;
}

.total-value {
  font-size: 7vh;
  font-weight: bold;
  font-family: 'Roboto', sans-serif;
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px rgba(255, 120, 120, 0.6);
  transition: transform 0.2s;
}

/* PULSE */
.pulse {
  animation: pulseAnim 0.4s ease;
}

@keyframes pulseAnim {
  0%   { transform: scale(1); text-shadow: 0 0 10px rgba(255,255,255,0.6); }
  50%  { transform: scale(1.25); text-shadow: 0 0 25px rgba(255,255,255,1); }
  100% { transform: scale(1); text-shadow: 0 0 10px rgba(255,255,255,0.6); }
}

/* TIME */
.time-row {
  width: 100%;
  display: flex;
}

.quarter-box {
  width: 40%;
  font-size: 3.8vh;
  font-family: 'Orbitron';
  display: flex;
  align-items: center;
  justify-content: center;
}

.clock-box {
  width: 60%;
  font-size: 6.5vh;
  font-family: 'Orbitron';
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div class="container">

<div class="row header title">Footy Scores</div>

<div class="row bulldogs subtitle">Bulldogs</div>

<div class="row bulldogs score-values">
  <div class="score-box">
    <div class="label">Goals</div>
    <div id="g1" class="value">0</div>
  </div>
  <div class="score-box">
    <div class="label">Behinds</div>
    <div id="b1" class="value">0</div>
  </div>
</div>

<div class="row bulldogs button-row">
  <div class="button-group">
    <button class="minus" onclick="updateScore('g1',-1)">-</button>
    <button class="plus" onclick="updateScore('g1',1)">+</button>
  </div>
  <div class="button-group">
    <button class="minus" onclick="updateScore('b1',-1)">-</button>
    <button class="plus" onclick="updateScore('b1',1)">+</button>
  </div>
</div>

<div class="row bulldogs">
  <div class="total-box">
    <div id="t1" class="total-value">0</div>
  </div>
</div>

<div class="row opposition subtitle">Opposition</div>

<div class="row opposition score-values">
  <div class="score-box">
    <div class="label">Goals</div>
    <div id="g2" class="value">0</div>
  </div>
  <div class="score-box">
    <div class="label">Behinds</div>
    <div id="b2" class="value">0</div>
  </div>
</div>

<div class="row opposition button-row">
  <div class="button-group">
    <button class="minus" onclick="updateScore('g2',-1)">-</button>
    <button class="plus" onclick="updateScore('g2',1)">+</button>
  </div>
  <div class="button-group">
    <button class="minus" onclick="updateScore('b2',-1)">-</button>
    <button class="plus" onclick="updateScore('b2',1)">+</button>
  </div>
</div>

<div class="row opposition">
  <div class="total-box">
    <div id="t2" class="total-value">0</div>
  </div>
</div>

<div class="row time-section subtitle">Timing</div>

<div class="row time-section">
  <div class="time-row">
    <div id="quarter" class="quarter-box">Q1</div>
    <div id="clock" class="clock-box">0:00</div>
  </div>
</div>

<div class="row time-section">
  <div class="time-buttons">
    <button id="qMinus" class="minus" onclick="changeQuarter(-1)">-</button>
    <button id="qPlus" class="plus" onclick="changeQuarter(1)">+</button>

    <button class="pause" onclick="pauseTimer()">
      <svg viewBox="0 0 24 24">
        <rect x="6" y="5" width="4" height="14"/>
        <rect x="14" y="5" width="4" height="14"/>
      </svg>
    </button>

    <button class="play" onclick="startTimer()">
      <svg viewBox="0 0 24 24">
        <polygon points="8,5 19,12 8,19"/>
      </svg>
    </button>

    <button class="reset" onclick="resetTimer()">
      <svg viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12"/>
      </svg>
    </button>
  </div>
</div>

</div>

<script>
let scores = { g1:0, b1:0, g2:0, b2:0 };

function triggerPulse(id) {
  const el = document.getElementById(id);
  el.classList.remove("pulse");
  void el.offsetWidth;
  el.classList.add("pulse");
}

function updateScore(id, delta) {
  scores[id] = Math.max(0, scores[id] + delta);
  document.getElementById(id).textContent = scores[id];

  document.getElementById("t1").textContent = scores.g1*6 + scores.b1;
  document.getElementById("t2").textContent = scores.g2*6 + scores.b2;

  if (id === "g1" || id === "b1") {
    triggerPulse("t1");
  } else if (id === "g2" || id === "b2") {
    triggerPulse("t2");
  }

}

let time = 0, running = false, interval;

function formatTime(t){
  let m = Math.floor(t/60);
  let s = t%60;
  return m + ":" + (s<10?"0":"") + s;
}

function updateClock(){
  document.getElementById("clock").textContent = formatTime(time);
}

function startTimer(){
  if(running) return;
  running = true;
  interval = setInterval(()=>{ time++; updateClock(); },1000);
}

function pauseTimer(){
  running = false;
  clearInterval(interval);
}

function resetTimer(){
  pauseTimer();
  time = 0;
  updateClock();
}

let q = 1;

function changeQuarter(d){
  q = Math.max(1, Math.min(4, q + d));
  document.getElementById("quarter").textContent = "Q" + q;
  updateQuarterButtons();
}

function updateQuarterButtons(){
  document.getElementById("qMinus").disabled = (q === 1);
  document.getElementById("qPlus").disabled = (q === 4);
}

updateClock();
updateQuarterButtons();
</script>

</body>
</html>
